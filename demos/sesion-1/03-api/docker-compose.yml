# App de demostración: dos versiones de la misma API, publicadas solo en 127.0.0.1.
#   insegura -> http://127.0.0.1:5001
#   segura   -> http://127.0.0.1:5002
# Uso: SECRET_KEY=$(openssl rand -hex 32) docker compose up -d --build
name: demo-facturas

services:
  permisos:
    build: .
    command: ["python", "permisos.py"]
    healthcheck:
      disable: true

  insegura:
    build:
      context: .
      dockerfile: Dockerfile.inseguro
    ports:
      - "127.0.0.1:5001:5000"
    depends_on: [permisos]

  segura:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY antes de levantar el entorno}
      DEBUG: "false"
    ports:
      - "127.0.0.1:5002:5000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    depends_on: [permisos]
