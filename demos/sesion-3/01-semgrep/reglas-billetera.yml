# Reglas para la Billetera UCP (sesión 3): autenticación, tokens y criptografía.
# Cada una con su CWE, su categoría del OWASP Top 10:2025 y su capítulo de ASVS 5.0.
rules:
  - id: jwt-sin-verificar-firma
    message: >-
      jwt.decode con verify_signature=False: cualquiera puede fabricar un token con el usuario que quiera.
      Verifique la firma y fije algorithms=["HS256"] (o el algoritmo que use).
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-347: Improper Verification of Cryptographic Signature", owasp: "A07:2025 Authentication Failures", asvs: "V9 Tokens autocontenidos"}
    pattern: |
      jwt.decode(..., options={..., "verify_signature": False, ...}, ...)

  - id: jwt-sin-algoritmos
    message: >-
      jwt.decode sin la lista algorithms=[...]: la librería no puede rechazar algoritmos que usted no usa.
    severity: WARNING
    languages: [python]
    metadata: {cwe: "CWE-327", owasp: "A04:2025 Cryptographic Failures", asvs: "V9 Tokens autocontenidos"}
    patterns:
      - pattern: jwt.decode($TOKEN, $KEY, ...)
      - pattern-not: jwt.decode($TOKEN, $KEY, ..., algorithms=$ALGS, ...)

  - id: hash-rapido-para-claves
    message: >-
      MD5/SHA-1/SHA-256 son hashes rápidos: no sirven para contraseñas. Use Argon2id (argon2-cffi), scrypt o bcrypt.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort", owasp: "A04:2025 Cryptographic Failures", asvs: "V11 Criptografía · V6 Autenticación"}
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.sha256(...)
      - pattern-inside: |
          def $F(..., $CLAVE, ...):
              ...
      - metavariable-regex: {metavariable: $CLAVE, regex: (?i)(clave|password|passwd|contrase)}

  - id: aes-modo-ecb
    message: >-
      AES en modo ECB: el mismo dato produce el mismo cifrado y no detecta manipulación.
      Use cifrado autenticado: AESGCM o ChaCha20Poly1305 con un nonce aleatorio por mensaje.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm", owasp: "A04:2025 Cryptographic Failures", asvs: "V11 Criptografía"}
    pattern: modes.ECB(...)

  - id: secreto-en-el-codigo
    message: >-
      Secreto o llave escrita en el código: queda en el historial de git para siempre.
      Léala del entorno o de un gestor de secretos.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-798: Use of Hard-coded Credentials", owasp: "A04:2025 Cryptographic Failures", asvs: "V13 Configuración"}
    patterns:
      - pattern-either:
          - pattern: $NOMBRE = "..."
          - pattern: $NOMBRE = b"..."
      - metavariable-regex: {metavariable: $NOMBRE, regex: (?i).*(secret|llave|key|token).*}

  - id: columna-desde-la-peticion
    message: >-
      El nombre de columna sale del JSON de la petición: asignación masiva (API3) e inyección SQL en el identificador.
      Recorra una lista blanca de campos, no las llaves que envió el cliente.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes", owasp: "A01:2025 Broken Access Control", asvs: "V8 Autorización"}
    patterns:
      - pattern-inside: |
          for $CAMPO, $VALOR in (request.get_json(...) or ...).items():
              ...
      - pattern: |
          $DB.execute(f"...{$CAMPO}...", ...)
