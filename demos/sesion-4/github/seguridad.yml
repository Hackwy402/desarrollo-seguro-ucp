# Pipeline mínimo de seguridad para la sesión 1.
# Copiar a .github/workflows/seguridad.yml del repositorio de demo.
# Las imágenes van con versión fija; el 20 de noviembre veremos cómo fijarlas por hash (digest).
name: seguridad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos en el historial (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact -v

  sast:
    name: Análisis estático (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@v4
      - name: semgrep
        run: semgrep scan --config .semgrep/reglas-principios.yml --metrics=off --error

  contenedor:
    name: Configuración del Dockerfile (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy config
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.73.0 \
            config --exit-code 1 --severity HIGH,CRITICAL /src
